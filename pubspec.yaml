name: geogame
description: "A location guessing game based on maps, available on both mobile, PC and web"
publish_to: none
version: 1.6.10+16
environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  theme_mode_builder: ^2.0.0
  salomon_bottom_bar: ^3.3.2
  http: ^1.5.0
  supabase_flutter: ^2.12.4
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  uuid: ^4.5.2
  vector_math: ^2.2.0
  collection: ^1.19.1
  google_mobile_ads: ^5.3.0
  app_links: ^7.2.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  web:
    generate: true
    image_path: "assets/images/logo.png"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "assets/images/logo_background.png"
  adaptive_icon_foreground: "assets/images/logo_foreground.png"
# flutter pub run flutter_launcher_icons:main

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/geojson/
    - assets/lang/
    - assets/flags/