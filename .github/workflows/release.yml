# ============================================================
# GeoGame – GitHub Actions Release Pipeline
# ============================================================
# Triggers:
#   - Push of a version tag (v1.x.x)
#   - Manual dispatch (workflow_dispatch)
#
# Jobs (run in parallel where independent):
#   android  – APK + AAB build & sign  (ubuntu-latest)
#   web      – Flutter web build + Vercel deploy (ubuntu-latest)
#   windows  – Windows build + Inno Setup + code sign (windows-latest)
#   release  – GitHub Release + Play Store upload
#              runs after all platform jobs succeed
# ============================================================

name: GeoGame Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      play_track:
        description: 'Play Store track'
        required: true
        default: 'production'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      upload_to_play:
        description: 'Upload AAB to Play Store?'
        required: true
        default: 'true'
        type: boolean
      create_github_release:
        description: 'Create / update GitHub Release?'
        required: true
        default: 'true'
        type: boolean

# ── Concurrency: cancel in-progress runs for the same ref ───────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Environment variables shared across all jobs ─────────────────────────────
env:
  FLUTTER_CHANNEL: stable
  PACKAGE_NAME: com.keremkuyucu.geogame

# ============================================================
# JOB: android
# ============================================================
jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      # ── Checkout ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Extract version from pubspec.yaml ─────────────────
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | tr -d '[:space:]')
          VERSION_CODE=$(grep '^version:' pubspec.yaml | sed 's/.*+//' | tr -d '[:space:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "GeoGame version: ${VERSION}+${VERSION_CODE}"

      # ── Flutter SDK ───────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: flutter-${{ env.FLUTTER_CHANNEL }}-${{ hashFiles('pubspec.lock') }}

      # ── Java 17 (required for Android build) ──────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Android Signing – Keystore ─────────────────────────
      # ANDROID_KEYSTORE_BASE64: base64-encoded .jks file (GitHub Secret)
      # android/key.properties: read by build.gradle.kts
      # The Gradle script checks for android/key.properties first (relative path),
      # then falls back to the imza-bilgileri path (local only).
      - name: Set up Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/keystore.jks

          printf 'storeFile=../app/keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

          echo "Keystore configured."

      # ── Dependencies ──────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── Build Release APK (split per ABI) ─────────────────
      - name: Build release APK (split-per-abi)
        run: flutter build apk --release --split-per-abi

      # ── Build Release AAB ─────────────────────────────────
      - name: Build release AAB
        run: flutter build appbundle --release

      # ── Clean up signing files ────────────────────────────
      - name: Remove keystore and key.properties
        if: always()
        run: |
          rm -f android/app/keystore.jks
          rm -f android/key.properties

      # ── Upload APK artifacts ──────────────────────────────
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ steps.version.outputs.version }}
          path: build/app/outputs/apk/release/*.apk
          retention-days: 30

      # ── Upload AAB artifact ───────────────────────────────
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ steps.version.outputs.version }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # ============================================================
  # JOB: web
  # ============================================================
  web:
    name: Web (Flutter → Vercel)
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Flutter SDK ───────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: flutter-${{ env.FLUTTER_CHANNEL }}-${{ hashFiles('pubspec.lock') }}

      # ── Dependencies ──────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── Build Web ─────────────────────────────────────────
      - name: Build Flutter web (release)
        run: flutter build web --release

      # ── Deploy to Vercel (production) ──────────────────────
      # Copies project.json to build/web/.vercel and deploys via official Vercel CLI
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          mkdir -p build/web/.vercel
          cp web/.vercel/project.json build/web/.vercel/project.json
          npx --yes vercel deploy ./build/web --prod --yes --token "$VERCEL_TOKEN"

  # ============================================================
  # JOB: windows
  # ============================================================
  windows:
    name: Windows (Installer + Code Sign)
    runs-on: windows-latest
    environment: windows-release

    outputs:
      version: ${{ steps.version.outputs.version }}
      installer_name: ${{ steps.inno.outputs.installer_name }}

    steps:
      # ── Checkout ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Flutter SDK ───────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: flutter-${{ env.FLUTTER_CHANNEL }}-${{ hashFiles('pubspec.lock') }}

      # ── Extract version ───────────────────────────────────
      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $versionLine = (Get-Content pubspec.yaml | Select-String '^version:').ToString()
          $version = ($versionLine -replace 'version:\s*', '' -replace '\+.*', '').Trim()
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      # ── Dependencies ──────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── Build Windows release ─────────────────────────────
      - name: Build Flutter Windows (release)
        run: flutter build windows --release

      # ── Install Inno Setup 6 ──────────────────────────────
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # Locate ISCC.exe
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = Get-ChildItem "C:\Program Files (x86)" -Recurse -Filter "ISCC.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw "ISCC.exe not found after choco install innosetup" }
          echo "ISCC_PATH=$iscc" >> $env:GITHUB_ENV
          Write-Host "Inno Setup Compiler: $iscc"

      # ── Build installer with Inno Setup ───────────────────
      # Overrides hardcoded local paths in InnoSetup.iss using /D preprocessor defines.
      # This leaves local defaults intact; local builds still work without any flags.
      - name: Build installer (Inno Setup)
        id: inno
        shell: pwsh
        run: |
          $version    = "${{ steps.version.outputs.version }}"
          $outDir     = "${{ github.workspace }}\installer_output"
          $projectRoot = "${{ github.workspace }}"

          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          & "${{ env.ISCC_PATH }}" `
            "/DProjectRoot=$projectRoot" `
            "/DOutputDir=$outDir" `
            "/DAppVersion=$version" `
            "$projectRoot\InnoSetup.iss"

          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed (ExitCode=$LASTEXITCODE)" }

          $installer = Get-ChildItem -Path $outDir -Filter "*.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "Installer .exe not found in $outDir" }

          $sizeMB = [math]::Round($installer.Length / 1MB, 2)
          Write-Host "Installer: $($installer.Name) (${sizeMB} MB)"

          echo "INSTALLER_PATH=$($installer.FullName)" >> $env:GITHUB_ENV
          echo "installer_name=$($installer.Name)" >> $env:GITHUB_OUTPUT

      # ── Write PFX certificate from secret ─────────────────
      - name: Write PFX certificate
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
        run: |
          $clean = ($env:WINDOWS_PFX_BASE64 -replace '\s+', '')
          $pfxBytes = [Convert]::FromBase64String($clean)
          [IO.File]::WriteAllBytes("${{ github.workspace }}\signing.pfx", $pfxBytes)
          Write-Host "PFX written."

      # ── Locate SignTool ───────────────────────────────────
      - name: Locate SignTool
        shell: pwsh
        run: |
          # Check well-known Windows SDK paths first (x64 preferred)
          $candidates = @(
            "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe",
            "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe",
            "C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64\signtool.exe",
            "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x86\signtool.exe",
            "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x86\signtool.exe"
          )

          $found = $null
          foreach ($c in $candidates) {
            if (Test-Path $c) { $found = $c; break }
          }

          if (-not $found) {
            $found = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch 'arm' } |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $found) { throw "signtool.exe not found on runner" }
          echo "SIGNTOOL_PATH=$found" >> $env:GITHUB_ENV
          Write-Host "SignTool: $found"

      # ── Sign installer (SHA-256 + timestamp) ─────────────
      - name: Sign installer
        shell: pwsh
        env:
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $timestampServers = @(
            "http://timestamp.sectigo.com",
            "http://timestamp.digicert.com",
            "http://tsa.starfieldtech.com",
            "http://timestamp.globalsign.com/tsa/r6advanced1"
          )

          $pfxPath      = "${{ github.workspace }}\signing.pfx"
          $pfxPassword  = if ($env:WINDOWS_PFX_PASSWORD) { $env:WINDOWS_PFX_PASSWORD.Trim() } else { "" }
          if (-not $pfxPassword) { throw "WINDOWS_PFX_PASSWORD secret is missing or empty." }
          $installer    = "${{ env.INSTALLER_PATH }}"
          $signtool     = "${{ env.SIGNTOOL_PATH }}"

          $signed = $false
          foreach ($ts in $timestampServers) {
            Write-Host "Trying timestamp server: $ts"
            & $signtool sign /fd SHA256 /tr $ts /td SHA256 /f $pfxPath /p $pfxPassword $installer 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Signed successfully with $ts"
              $signed = $true
              break
            }
            Write-Host "  Timestamp server failed, trying next..."
          }

          if (-not $signed) {
            throw "All timestamp servers failed. Release signing aborted."
          }

          # Import certificate to Root store so signtool verify can validate the chain
          try {
            $secPass = ConvertTo-SecureString $pfxPassword -AsPlainText -Force
            Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\LocalMachine\Root -Password $secPass | Out-Null
            Write-Host "Certificate added to LocalMachine\Root for verification."
          } catch {
            Write-Warning "Could not import certificate to Root store: $_"
          }

          # Verify signature
          & $signtool verify /pa /v $installer 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Signature verified successfully."
          } else {
            Write-Warning "Installer is signed, but root chain verification returned non-zero (expected for self-signed certificates)."
          }
          Write-Host "Signing complete."

      # ── Clean up PFX ─────────────────────────────────────
      - name: Remove PFX
        if: always()
        shell: pwsh
        run: Remove-Item -Path "${{ github.workspace }}\signing.pfx" -Force -ErrorAction SilentlyContinue

      # ── Upload installer artifact ─────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ steps.version.outputs.version }}
          path: ${{ env.INSTALLER_PATH }}
          retention-days: 30

  # ============================================================
  # JOB: release
  # Runs after all platform jobs succeed.
  # Creates/updates GitHub Release and optionally uploads to Play Store.
  # ============================================================
  release:
    name: GitHub Release & Play Store
    runs-on: ubuntu-latest
    needs: [android, web, windows]
    # Only run on tag pushes or when explicitly requested via manual dispatch
    if: >
      github.event_name == 'push' ||
      github.event.inputs.create_github_release == 'true' ||
      github.event.inputs.upload_to_play == 'true'
    permissions:
      contents: write
    environment: production

    steps:
      # ── Checkout (for release notes files) ───────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Set up Python ─────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── Generate release notes via Gemini API if missing ───
      - name: Generate release notes (Gemini API)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          VERSION="${{ needs.android.outputs.version }}"
          NOTES_FILE="RELEASE_${VERSION}.md"
          PLAY_NOTES="RELEASE_PLAY_STORE_${VERSION}.md"

          if [ -f "$NOTES_FILE" ] && [ -f "$PLAY_NOTES" ]; then
            echo "Release notes already exist in repository: $NOTES_FILE and $PLAY_NOTES"
          elif [ -n "$GEMINI_API_KEY" ]; then
            echo "Release notes missing or incomplete. Generating automatically with Gemini API for v${VERSION}..."
            python scripts/generate_release_notes.py --engine gemini --version "$VERSION"
          else
            echo "GEMINI_API_KEY not configured and release notes not present; using standard release info."
          fi

      # ── Determine version & tag ───────────────────────────
      - name: Determine release metadata
        id: meta
        run: |
          VERSION="${{ needs.android.outputs.version }}"
          TAG="v${VERSION}"
          TITLE="GeoGame v${VERSION}"
          NOTES_FILE="RELEASE_${VERSION}.md"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

          if [ -f "$NOTES_FILE" ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
            echo "Found release notes: $NOTES_FILE"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
            echo "No release notes file found for $NOTES_FILE, using generic description."
          fi

      # ── Download APK artifacts ────────────────────────────
      - name: Download Android APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk-${{ needs.android.outputs.version }}
          path: release-assets/

      # ── Download Windows installer artifact ───────────────
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer-${{ needs.android.outputs.version }}
          path: release-assets/

      # ── List release assets ───────────────────────────────
      - name: List release assets
        run: ls -lh release-assets/

      # ── Create GitHub Release (with release notes if available) ──
      - name: Create GitHub Release
        if: >
          github.event_name == 'push' ||
          github.event.inputs.create_github_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body_path: ${{ steps.meta.outputs.has_notes == 'true' && steps.meta.outputs.notes_file || '' }}
          body: ${{ steps.meta.outputs.has_notes != 'true' && format('GeoGame {0} – automated release.', steps.meta.outputs.tag) || '' }}
          files: |
            release-assets/*.apk
            release-assets/*.exe
          draft: false
          prerelease: false
          generate_release_notes: ${{ steps.meta.outputs.has_notes != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Download AAB (Play Store only) ────────────────────
      - name: Download AAB artifact
        if: >
          github.event_name == 'push' ||
          github.event.inputs.upload_to_play == 'true'
        uses: actions/download-artifact@v4
        with:
          name: android-aab-${{ needs.android.outputs.version }}
          path: play-assets/


      - name: Install Google API Python libraries
        if: >
          github.event_name == 'push' ||
          github.event.inputs.upload_to_play == 'true'
        run: pip install google-api-python-client google-auth

      # ── Write Play Store service account JSON ─────────────
      # PLAY_SERVICE_ACCOUNT_JSON: full JSON content (GitHub Secret)
      # Written to /tmp and deleted after upload.
      - name: Write Play Store service account JSON
        if: >
          github.event_name == 'push' ||
          github.event.inputs.upload_to_play == 'true'
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT_JSON" > /tmp/play-service-account.json
          echo "Service account JSON written."

      # ── Upload AAB to Play Store ───────────────────────────
      - name: Upload AAB to Play Store
        if: >
          github.event_name == 'push' ||
          github.event.inputs.upload_to_play == 'true'
        run: |
          VERSION="${{ needs.android.outputs.version }}"
          TRACK="${{ github.event.inputs.play_track || 'internal' }}"
          NOTES_FILE="RELEASE_PLAY_STORE_${VERSION}.md"
          NOTES_ARG=""
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARG="--release-notes $NOTES_FILE"
            echo "Using Play Store release notes: $NOTES_FILE"
          fi

          python scripts/upload_play_store.py \
            --aab play-assets/app-release.aab \
            --service-account /tmp/play-service-account.json \
            --package-name ${{ env.PACKAGE_NAME }} \
            --track "$TRACK" \
            --status completed \
            $NOTES_ARG

      # ── Clean up service account JSON ─────────────────────
      - name: Remove service account JSON
        if: always()
        run: rm -f /tmp/play-service-account.json
